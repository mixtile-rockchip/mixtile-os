name: Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board (all = every board)
        type: choice
        default: all
        options: [all, mixtile-blade3, mixtile-edge2, mixtile-core3588e]
      suite:
        description: Suite (all = every suite)
        type: choice
        default: all
        options: [all, noble, resolute, bookworm, trixie]
      flavor:
        description: Flavor (all = every flavor)
        type: choice
        default: all
        options: [all, server, desktop]

run-name: Build

permissions:
  contents: read

env:
  # Single source for the build environment. Native runner, no container:
  # the runner is a full VM with passwordless root, loop devices, mount and udev.
  BUILD_DEPS: >-
    ca-certificates curl wget git file xz-utils zstd bzip2 patch lsb-release
    dctrl-tools mmdebstrap arch-test qemu-user-static binfmt-support
    debian-archive-keyring ubuntu-keyring gpg gpg-agent dirmngr apt-utils
    build-essential debhelper devscripts dpkg-dev fakeroot quilt
    gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev dwarves kmod
    cpio rsync python3 python3-dev python3-setuptools python3-pyelftools
    python-is-python3 swig libpython3-dev u-boot-tools device-tree-compiler
    libfdt-dev libgnutls28-dev uuid-dev parted fdisk gdisk dosfstools
    e2fsprogs uuid-runtime util-linux udev

jobs:
  # Created up front so image jobs can upload straight into it as they finish,
  # the same shape release.yml uses. A draft is invisible until promoted, so a
  # run that produces nothing never shows up as a release.
  prepare:
    runs-on: ubuntu-24.04
    name: Create pre-release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Create draft pre-release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tag is <UTC date>-b<run number>, but the date is only meaningful at
          # first creation: a re-run can land on a different UTC day, and the
          # tag must not move. So the release this run already owns is found by
          # run id -- exact, and independent of whatever the tag ended up being.
          #
          # run_number names the build for humans; run_id associates the run
          # with its release. Neither does the other's job.
          marker="<!-- mixtile-build-run-id: ${GITHUB_RUN_ID} -->"
          # --paginate, so the answer does not depend on the release being
          # recent enough to fall inside some page limit.
          matches="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                     --jq ".[] | select((.body // \"\") | contains(\"${marker}\")) | .tag_name")"
          tag="$(printf '%s' "${matches}" | head -n1)"
          if [ -z "${tag}" ]; then
              tag="$(date -u +%Y.%m.%d)-b${GITHUB_RUN_NUMBER}"
              # The commit lives in the body rather than the tag: a tag already
              # points at a commit, and a second copy of it only makes the name
              # longer. --notes is prepended to --generate-notes' changelog.
              notes="$(printf '%s\n\nBuilt from commit %s\nWorkflow run #%s\n' \
                       "${marker}" "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}")"
              gh release create "${tag}" \
                  --target "${GITHUB_SHA}" \
                  --title "Mixtile OS ${tag}" \
                  --draft \
                  --prerelease \
                  --notes "${notes}" \
                  --generate-notes
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  rootfs:
    runs-on: ubuntu-24.04
    name: Build rootfs
    # Package installation runs under qemu emulation and is single-threaded,
    # so a desktop rootfs is the longest stage in the pipeline.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ inputs.suite == 'all' && fromJSON('["noble","resolute","bookworm","trixie"]') || fromJSON(format('["{0}"]', inputs.suite)) }}
        flavor: ${{ inputs.flavor == 'all' && fromJSON('["server","desktop"]') || fromJSON(format('["{0}"]', inputs.flavor)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${BUILD_DEPS}

      # binfmt registration is host kernel state, not image content, and
      # qemu-user-static only registers it as a side effect of being installed.
      - name: Verify arm64 binfmt handler
        run: |
          set -eu
          f=/proc/sys/fs/binfmt_misc/qemu-aarch64
          [ -f "${f}" ] || { echo "Error: no qemu-aarch64 handler registered"; exit 1; }
          cat "${f}"
          grep -q '^enabled' "${f}" || { echo "Error: handler is not enabled"; exit 1; }
          grep -q '^flags:' "${f}" || { echo "Error: handler reports no flags line"; exit 1; }
          awk '/^flags:/ { if ($2 !~ /F/) { print "Error: flags " $2 " lack F (fix-binary)"; exit 1 } }' "${f}"
          arch-test arm64

      - name: Build rootfs
        run: sudo ./build.sh --suite=${{ matrix.suite }} --flavor=${{ matrix.flavor }} --rootfs-only

      # Board-independent, so one tarball serves every board of this suite/flavor.
      # Job-to-job transport only: the cleanup job deletes it when the run ends,
      # and retention-days is the backstop for when that does not happen.
      - name: Upload rootfs tarball
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ matrix.suite }}-${{ matrix.flavor }}
          path: build/*.rootfs.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  kernel:
    runs-on: ubuntu-24.04
    name: Build kernel
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${BUILD_DEPS}

      # bindeb-pkg output is distribution-agnostic and the tree is board-agnostic,
      # so a single build serves every suite, flavor and board.
      - name: Build kernel packages
        run: sudo ./build.sh --kernel-only --kernel=vendor

      # Same exclusions config-image.sh applies: -dbg is 120MB of symbols and
      # linux-libc-dev would displace the archive's own.
      - name: Upload kernel packages
        uses: actions/upload-artifact@v7
        with:
          name: kernel-vendor
          path: |
            build/*.deb
            !build/*-dbg_*.deb
            !build/linux-libc-dev_*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    runs-on: ubuntu-24.04
    needs: [prepare, rootfs, kernel]
    name: Build image
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        board: ${{ inputs.board == 'all' && fromJSON('["mixtile-blade3","mixtile-edge2","mixtile-core3588e"]') || fromJSON(format('["{0}"]', inputs.board)) }}
        suite: ${{ inputs.suite == 'all' && fromJSON('["noble","resolute","bookworm","trixie"]') || fromJSON(format('["{0}"]', inputs.suite)) }}
        flavor: ${{ inputs.flavor == 'all' && fromJSON('["server","desktop"]') || fromJSON(format('["{0}"]', inputs.flavor)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${BUILD_DEPS}

      - name: Verify arm64 binfmt handler
        run: |
          set -eu
          f=/proc/sys/fs/binfmt_misc/qemu-aarch64
          [ -f "${f}" ] || { echo "Error: no qemu-aarch64 handler registered"; exit 1; }
          grep -q '^enabled' "${f}" || { echo "Error: handler is not enabled"; exit 1; }
          grep -q '^flags:' "${f}" || { echo "Error: handler reports no flags line"; exit 1; }
          awk '/^flags:/ { if ($2 !~ /F/) { print "Error: flags " $2 " lack F (fix-binary)"; exit 1 } }' "${f}"

      # Restoring these into build/ makes the kernel and rootfs stages skip
      # themselves, so the workflow needs no CI-specific interface.
      - name: Download rootfs artifact
        uses: actions/download-artifact@v8
        with:
          name: rootfs-${{ matrix.suite }}-${{ matrix.flavor }}
          path: build

      - name: Download kernel artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-vendor
          path: build

      - name: Build image
        run: |
          sudo ./build.sh \
            --board=${{ matrix.board }} \
            --suite=${{ matrix.suite }} \
            --flavor=${{ matrix.flavor }} \
            --kernel=vendor

      # Straight into the draft pre-release rather than through an artifact: the
      # images are the product, and an artifact copy of them would be a second
      # 20GB of storage that nothing ever reads. Build logs are not uploaded
      # either -- build.sh tees them to stdout, so the job log already has them.
      - name: Upload image to pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "${TAG}" \
              images/*.img.xz images/*.img.xz.sha256 --clobber

  publish:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    name: Publish pre-release
    # always(), so that the draft prepare created is always either promoted or
    # dropped -- an abandoned draft would otherwise outlive every run that was
    # cancelled or failed outright.
    if: always()
    permissions:
      contents: write
    steps:
      - name: Promote draft to pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -eu
          [ -n "${TAG}" ] || { echo "Error: no tag, prepare did not run"; exit 1; }
          count="$(gh release view "${TAG}" --json assets \
                   --jq '[.assets[] | select(.name | endswith(".img.xz"))] | length')"
          # A manual build publishes whatever succeeded; formal releases are
          # tag-driven and all-or-nothing (see release.yml). Anything other than
          # success or failure -- cancelled, skipped -- publishes nothing.
          #
          # Dropping the draft is this job's own tag and nothing else; finished
          # releases are never touched here.
          if [ "${BUILD_RESULT}" != "success" ] && [ "${BUILD_RESULT}" != "failure" ]; then
              gh release delete "${TAG}" --yes --cleanup-tag || true
              echo "build was ${BUILD_RESULT}, dropped the empty draft"
              exit 0
          fi
          if [ "${count}" -eq 0 ]; then
              gh release delete "${TAG}" --yes --cleanup-tag || true
              echo "Error: no images to publish"
              exit 1
          fi
          title="Mixtile OS ${TAG}"
          [ "${BUILD_RESULT}" == "success" ] || title="${title} (partial)"
          gh release edit "${TAG}" --title "${title}" --draft=false --prerelease
          echo "### [${TAG}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}) — ${count} image(s)" \
              >> "${GITHUB_STEP_SUMMARY}"

  # Artifacts here are job-to-job transport, never a deliverable. Leaving them
  # behind is what filled the repository's artifact storage and made unrelated
  # uploads fail, so every run cleans up after itself -- including failed ones.
  cleanup:
    runs-on: ubuntu-24.04
    needs: [prepare, rootfs, kernel, build, publish]
    name: Delete run artifacts
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete every artifact this run created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # pipefail so a failed listing cannot read as "nothing left to delete".
          set -euo pipefail
          # Listed by run id, not by name: nothing else in the repository can be
          # reached this way, and no naming convention has to stay in sync.
          list() {
              gh api --paginate \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                  --jq '.artifacts[] | "\(.id)\t\(.size_in_bytes)\t\(.name)"'
          }

          artifacts="$(list)"
          total=0
          failed=0
          while IFS="$(printf '\t')" read -r id size name; do
              [ -n "${id}" ] || continue
              if gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; then
                  echo "deleted ${name} (${size} bytes)"
                  total=$((total + size))
              else
                  echo "failed to delete ${name} (id ${id})"
                  failed=$((failed + 1))
              fi
          done <<< "${artifacts}"

          remaining="$(list | wc -l | tr -d ' ')"
          printf '### Artifact cleanup\n\nFreed %s MiB, %s left, %s delete(s) failed.\n' \
              "$((total / 1048576))" "${remaining}" "${failed}" >> "${GITHUB_STEP_SUMMARY}"
          [ "${remaining}" -eq 0 ] || { echo "Error: ${remaining} artifact(s) left"; exit 1; }
